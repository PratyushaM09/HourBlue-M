spring:
  application:
    name: HourBlue
  profiles:
    default: dev
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:hourblue}
    username: ${DB_USERNAME:hourblue_app}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: ${MAX_IMAGE_SIZE:5MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:6MB}

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

hourblue:
  time-zone: ${APP_TIME_ZONE:UTC}
  site-base-url: ${SITE_BASE_URL:http://localhost:8080}
