<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="HourBlue is a quiet visual-discovery gallery of curated published posts.">
    <title>HourBlue</title>
    <link rel="stylesheet" th:href="@{/css/site.css}" href="/css/site.css">
</head>
<body>
    <main class="site-shell">
        <header class="intro">
            <p class="brand">HourBlue</p>
            <h1>Visual discovery for calm inspiration.</h1>
            <p>Browse published finds selected for image-first wandering and thoughtful detail.</p>
        </header>

        <section class="subscribe" aria-labelledby="subscribe-title">
            <h2 id="subscribe-title">Join the HourBlue list</h2>
            <p>Get occasional notes when new visual finds are ready.</p>
            <p class="notice success" th:if="${subscriptionSuccessMessage}" th:text="${subscriptionSuccessMessage}"></p>
            <p class="notice error" th:if="${subscriptionErrorMessage}" th:text="${subscriptionErrorMessage}"></p>
            <form th:action="@{/subscribe}" th:object="${subscriptionForm}" method="post">
                <label for="subscriptionEmail">Email</label>
                <div class="subscribe-form">
                    <input id="subscriptionEmail" type="email" th:field="*{email}" maxlength="320" autocomplete="email" required>
                    <button type="submit">Subscribe</button>
                </div>
            </form>
        </section>

        <section class="today-moment" aria-labelledby="today-moment-title" th:if="${todayMoment != null}">
            <p class="browse-type">Today's Moment</p>
            <a class="image-link" th:href="@{/posts/{slug}(slug=${todayMoment.slug})}">
                <img th:src="${todayMoment.imageUrl}" th:alt="${todayMoment.altText}">
            </a>
            <div class="post-card-body">
                <p class="post-meta">
                    <a th:href="@{/categories/{slug}(slug=${todayMoment.category.slug})}" th:text="${todayMoment.category.name}"></a>
                    <a th:if="${todayMoment.mood != null}" th:href="@{/moods/{slug}(slug=${todayMoment.mood.slug})}" th:text="${todayMoment.mood.displayName}"></a>
                </p>
                <h2 id="today-moment-title">
                    <a th:href="@{/posts/{slug}(slug=${todayMoment.slug})}" th:text="${todayMoment.title}"></a>
                </h2>
            </div>
        </section>

        <section aria-labelledby="gallery-title">
            <h2 id="gallery-title">Published Posts</h2>

            <p class="empty" th:if="${posts.empty}">No published posts yet.</p>

            <div class="gallery" th:if="${!posts.empty}">
                <article class="post-card" th:each="post : ${posts.content}">
                    <a class="image-link" th:href="@{/posts/{slug}(slug=${post.slug})}">
                        <img th:src="${post.imageUrl}" th:alt="${post.altText}">
                    </a>
                    <div class="post-card-body">
                        <p class="post-meta">
                            <a th:href="@{/categories/{slug}(slug=${post.category.slug})}" th:text="${post.category.name}"></a>
                            <a th:if="${post.mood != null}" th:href="@{/moods/{slug}(slug=${post.mood.slug})}" th:text="${post.mood.displayName}"></a>
                        </p>
                        <h3><a th:href="@{/posts/{slug}(slug=${post.slug})}" th:text="${post.title}"></a></h3>
                    </div>
                </article>
            </div>

            <nav class="pagination" aria-label="Gallery pages" th:if="${posts.totalPages > 1}">
                <a th:if="${posts.hasPrevious()}" th:href="@{/(page=${posts.number - 1})}">Previous</a>
                <span th:text="${posts.number + 1}"></span>
                <a th:if="${posts.hasNext()}" th:href="@{/(page=${posts.number + 1})}">Next</a>
            </nav>
        </section>
    </main>
</body>
</html>
