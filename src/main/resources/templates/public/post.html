<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:replace="~{fragments/seo :: tags(${seoTitle}, ${seoDescription}, ${canonicalUrl}, ${ogType}, ${ogImageUrl}, ${ogImageAlt})}"></th:block>
    <link rel="stylesheet" th:href="@{/css/site.css}" href="/css/site.css">
    <script type="application/ld+json" th:utext="${structuredDataJson}"></script>
</head>
<body>
    <main class="site-shell detail">
        <a class="back-link" th:href="@{/}" href="/">Back to HourBlue</a>

        <article class="post-detail">
            <header>
                <p class="brand">HourBlue</p>
                <p class="post-meta">
                    <a th:href="@{/categories/{slug}(slug=${post.category.slug})}" th:text="${post.category.name}"></a>
                    <a th:if="${post.mood != null}" th:href="@{/moods/{slug}(slug=${post.mood.slug})}" th:text="${post.mood.displayName}"></a>
                </p>
                <h1 th:text="${post.title}"></h1>
                <time th:if="${post.publishedAt}" th:datetime="${post.publishedAt}" th:text="${post.publishedAt}"></time>
            </header>

            <img th:src="${post.imageUrl}" th:alt="${post.altText}">
            <p th:text="${post.description}"></p>
            <p th:if="${sourceUrlSafe}">
                <a th:href="${post.sourceUrl}" target="_blank" rel="noopener noreferrer">Source</a>
            </p>
        </article>
    </main>
    <footer th:replace="~{fragments/footer :: publicFooter}"></footer>
</body>
</html>
