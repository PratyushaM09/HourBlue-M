<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <th:block th:replace="~{fragments/seo :: tags(${seoTitle}, ${seoDescription}, ${canonicalUrl}, ${ogType}, ${ogImageUrl}, ${ogImageAlt})}"></th:block>
    <link rel="stylesheet" th:href="@{/css/site.css}" href="/css/site.css">
</head>
<body>
    <main class="site-shell">
        <header class="intro">
            <p class="brand">HourBlue</p>
            <a class="back-link" th:href="@{/}" href="/">Home</a>
            <p class="browse-type" th:text="${browseType}"></p>
            <h1 th:text="${browseName}"></h1>
        </header>

        <section aria-labelledby="gallery-title">
            <h2 id="gallery-title">Published Posts</h2>

            <p class="empty" th:if="${posts.empty}">No published posts here yet.</p>

            <div class="gallery" th:if="${!posts.empty}">
                <article class="post-card" th:each="post : ${posts.content}">
                    <a class="image-link" th:href="@{/posts/{slug}(slug=${post.slug})}">
                        <img th:src="${post.imageUrl}" th:alt="${post.altText}" loading="lazy">
                    </a>
                    <div class="post-card-body">
                        <p class="post-meta">
                            <a th:href="@{/categories/{slug}(slug=${post.category.slug})}" th:text="${post.category.name}"></a>
                            <a th:if="${post.mood != null}" th:href="@{/moods/{slug}(slug=${post.mood.slug})}" th:text="${post.mood.displayName}"></a>
                        </p>
                        <h3><a th:href="@{/posts/{slug}(slug=${post.slug})}" th:text="${post.title}"></a></h3>
                    </div>
                </article>
            </div>

            <nav class="pagination" aria-label="Browse pages" th:if="${posts.totalPages > 1}">
                <a th:if="${previousPageUrl}" th:href="${previousPageUrl}">Previous</a>
                <span th:text="${posts.number + 1}"></span>
                <a th:if="${nextPageUrl}" th:href="${nextPageUrl}">Next</a>
            </nav>
        </section>
    </main>
</body>
</html>
