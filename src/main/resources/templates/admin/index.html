<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin - HourBlue</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}" href="/css/admin.css">
</head>
<body>
    <main class="admin-shell">
        <section class="panel" aria-labelledby="admin-title">
            <p class="brand">HourBlue</p>
            <h1 id="admin-title">HourBlue admin</h1>
            <p>Signed in as <strong th:text="${email}">admin@example.test</strong>.</p>

            <nav class="admin-nav" aria-label="Admin">
                <a th:href="@{/admin/categories}" href="/admin/categories">Categories</a>
                <a th:href="@{/admin/posts}" href="/admin/posts">Posts</a>
            </nav>

            <form th:action="@{/admin/logout}" action="/admin/logout" method="post">
                <button type="submit" class="secondary">Sign out</button>
            </form>
        </section>
    </main>
</body>
</html>
